dependencies:
  idf: ">=5.5,<6.1"
  # Espressif's panel driver is explicitly SH8601/QSPI and is pinned after the
  # attached board audit. Do not replace this with Waveshare's board-name BSP:
  # its current default panel path targets the V2 CO5300 controller.
  espressif/esp_lcd_sh8601:
    version: "2.0.1"
    public: true
  lvgl/lvgl:
    version: "9.2.2"
    public: true
  joltwallet/littlefs:
    version: "~=1.20.0"
    public: true

# FT3168 is handled by the native V1 I2C adapter in board_v1.cpp. Its register
# protocol is small enough to keep the board boundary auditable.
